# Phosphopeptide-enriched HeLa search: up to two variable modifications in total
# across methionine oxidation and phosphorylation on S/T/Y.
# Paper analysis recomputes tie-aware FDR from results.best.tsv.
Search:
  precursor_ppm: 10.0
  decoy_prefix: DECOY_
  fdr: 0.01
  batch_size: 1024
  spectra_per_batch: 32
  prefix_cache_size: 100000
  amp: false
  top_k: 10
  flush_every: 1000
  min_score: 0.0
  max_variable_mods: 2
  min_pep_len: 7
  max_pep_len: 32

Mods:
  fixed: "C:+57.021"
  variable: "M:+15.995,S:+79.966,T:+79.966,Y:+79.966"
