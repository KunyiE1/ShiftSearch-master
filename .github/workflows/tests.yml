name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: shiftsearch-search --help
      - run: shiftsearch-train --help
      - run: shiftsearch-fdr --help
      - run: shiftsearch-search --mgf examples/celegans/spectra.mgf --peptide-fasta examples/celegans/peptides.fasta --checkpoint weights/shiftsearch.ckpt --config configs/model.yaml --search-config examples/celegans/search.yaml --output outputs/celegans_example/results.tsv --device cpu --batch-size 64
      - run: python scripts/check_search_example.py --results outputs/celegans_example/results.best.tsv --expected examples/celegans/expected_best.tsv
      - run: python -m unittest discover -s tests -v
